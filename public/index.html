<body>
<div id="root"></div>

<!-- Installation / mise à jour PWA -->
<div id="pwa-banner" class="pwa-banner" hidden>
  <span id="pwa-banner-msg" class="pwa-banner-msg"></span>
  <button id="pwa-banner-action" class="pwa-banner-btn" type="button"></button>
  <button id="pwa-banner-dismiss" class="pwa-banner-x" type="button" aria-label="Fermer">×</button>
</div>

<script>
window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "skinType": "normale",
  "lifeMoment": "none",
  "memberTier": "Membre"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // ─── Service worker registration ───────────────────────────────
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js", { scope: "./" })
        .then((reg) => {
          // Détection de mise à jour
          reg.addEventListener("updatefound", () => {
            const installing = reg.installing;
            if (!installing) return;
            installing.addEventListener("statechange", () => {
              if (installing.state === "installed" && navigator.serviceWorker.controller) {
                showBanner("Une nouvelle version est disponible.", "Actualiser", () => {
                  installing.postMessage("SKIP_WAITING");
                });
              }
            });
          });
        })
        .catch((err) => console.warn("SW registration failed:", err));

      // Recharger après prise de contrôle d'un nouveau SW
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }

  // ─── Invitation d'installation (Android / Chromium) ──────────
  let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    if (sessionStorage.getItem("pwa-install-dismissed") === "1") return;
    showBanner("Installer Karinthi sur votre appareil ?", "Installer", async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      try { await deferredInstall.userChoice; } catch (_) {}
      deferredInstall = null;
      hideBanner();
    });
  });

  window.addEventListener("appinstalled", () => {
    deferredInstall = null;
    hideBanner();
  });

  function showBanner(msg, actionLabel, onAction) {
    const el = document.getElementById("pwa-banner");
    const m  = document.getElementById("pwa-banner-msg");
    const b  = document.getElementById("pwa-banner-action");
    const x  = document.getElementById("pwa-banner-dismiss");
    if (!el || !m || !b || !x) return;
    m.textContent = msg;
    b.textContent = actionLabel;
    b.onclick = onAction;
    x.onclick = () => {
      sessionStorage.setItem("pwa-install-dismissed", "1");
      hideBanner();
    };
    el.hidden = false;
  }
  function hideBanner() {
    const el = document.getElementById("pwa-banner");
    if (el) el.hidden = true;
  }
</script>
</body>
</html>
