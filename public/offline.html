<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Karinthi · Hors ligne</title>
  <meta name="theme-color" content="#0C3D52">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --petrol-500: #125773;
      --petrol-700: #0C3D52;
      --tilleul-300: #ACB75E;
      --tilleul-50: #F4F6E6;
      --paper: #FAFAF7;
      --ink: #1F1E18;
      --muted: #6B6859;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background:
        radial-gradient(900px 600px at 90% 0%, rgba(180,199,167,0.32) 0%, transparent 55%),
        radial-gradient(800px 600px at 5% 25%, rgba(245,223,215,0.55) 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 40px 28px;
      background: #fff;
      border-radius: 24px;
      border: 1px solid #E8E6DD;
      box-shadow: 0 24px 48px rgba(31,30,24,0.08);
    }
    .mark {
      width: 96px; height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--petrol-700);
      display: grid; place-items: center;
      color: var(--tilleul-50);
      font-family: 'Inter Tight', sans-serif;
      font-weight: 300;
      font-size: 56px;
      letter-spacing: -0.04em;
      border: 2px solid var(--tilleul-300);
    }
    h1 {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 300;
      font-size: 28px;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 24px;
      font-size: 15px;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--petrol-500);
      margin-bottom: 18px;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--petrol-700);
      color: var(--tilleul-50);
      padding: 14px 26px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    button:hover { background: var(--petrol-500); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">K</div>
    <div class="tag">Karinthi · Compagnon</div>
    <h1>Vous êtes hors ligne.</h1>
    <p>Votre compagnon parapharmacie ne parvient pas à joindre le réseau. La plupart des écrans restent disponibles depuis le cache — réessayez dans un instant.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
